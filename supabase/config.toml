# Supabase local config — compatible con CLI 2.x.
# Docs: https://supabase.com/docs/guides/cli/local-development
#
# Notas de migración (1.x → 2.x):
#   - El bloque [functions] ya NO acepta llaves planas como `verify_jwt = false`.
#     Ahora la configuración de funciones es POR FUNCIÓN: [functions.<nombre>].
#   - El runtime de funciones edge se controla con [edge_runtime] (deshabilitado por defecto aquí).
#   - Las URLs de redirección de auth deben ser explícitas (no globs).

project_id = "pqrs-energia"

# ----------------------------------------------------------------
# API (PostgREST)
# ----------------------------------------------------------------
[api]
enabled            = true
port               = 54321
schemas            = ["public", "storage", "graphql_public"]
extra_search_path  = ["public", "extensions"]
max_rows           = 1000

# ----------------------------------------------------------------
# Base de datos
# ----------------------------------------------------------------
[db]
port           = 54322
shadow_port    = 54320
major_version  = 15

[db.pooler]
enabled            = false
port               = 54329
pool_mode          = "transaction"
default_pool_size  = 20
max_client_conn    = 100

# ----------------------------------------------------------------
# Studio
# ----------------------------------------------------------------
[studio]
enabled = true
port    = 54323
api_url = "http://127.0.0.1"

# ----------------------------------------------------------------
# Inbucket (captura emails locales)
# ----------------------------------------------------------------
[inbucket]
enabled = true
port    = 54324
# smtp_port = 54325
# pop3_port = 54326

# ----------------------------------------------------------------
# Storage + buckets declarativos
# ----------------------------------------------------------------
[storage]
enabled         = true
file_size_limit = "50MiB"

[storage.buckets.pqrs-adjuntos]
public             = false
file_size_limit    = "20MiB"
allowed_mime_types = ["image/png", "image/jpeg", "application/pdf", "text/plain", "application/zip"]

[storage.buckets.respuestas]
public             = false
file_size_limit    = "20MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.normativa]
public             = false
file_size_limit    = "50MiB"
allowed_mime_types = ["application/pdf", "text/plain", "text/markdown"]

# ----------------------------------------------------------------
# Auth
# ----------------------------------------------------------------
[auth]
enabled                          = true
site_url                         = "http://127.0.0.1:3000"
additional_redirect_urls         = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry                       = 3600
enable_refresh_token_rotation    = true
refresh_token_reuse_interval     = 10
enable_signup                    = true
enable_anonymous_sign_ins        = false
enable_manual_linking            = false
minimum_password_length          = 6

[auth.email]
enable_signup           = true
double_confirm_changes  = true
enable_confirmations    = false   # facilita pruebas locales (no requiere clickear el mail)
secure_password_change  = false
max_frequency           = "1s"
otp_length              = 6
otp_expiry              = 3600

[auth.sms]
enable_signup        = false
enable_confirmations = false
template             = "Your code is {{ .Code }}"
max_frequency        = "5s"

# ----------------------------------------------------------------
# Realtime
# ----------------------------------------------------------------
[realtime]
enabled = true

# ----------------------------------------------------------------
# Edge runtime (funciones)
# Si en el futuro agregas funciones en supabase/functions/<nombre>/index.ts,
# activa `enabled = true` y declara por función:
#   [functions.<nombre>]
#   verify_jwt = false
#   import_map = "./supabase/functions/<nombre>/deno.json"
# ----------------------------------------------------------------
[edge_runtime]
enabled        = false
policy         = "oneshot"
inspector_port = 8083

# ----------------------------------------------------------------
# Analytics (Logflare local) — desactivado para ahorrar memoria
# ----------------------------------------------------------------
[analytics]
enabled = false
